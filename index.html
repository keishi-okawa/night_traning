/* Change set 001: always-on 2.5D animated island and real facility illustrations */
.island-scene.animated-island{position:relative;isolation:isolate;aspect-ratio:16/9;min-height:250px;max-height:560px;background:#172b4b;perspective:1100px;transform-style:preserve-3d}
.island-scene.animated-island:after{z-index:4;inset:56% 0 0;background:linear-gradient(transparent,#081426c9);}
.island-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transform:translateZ(-12px) scale(1.035);animation:sceneCameraFloat 13s ease-in-out infinite;}
@keyframes sceneCameraFloat{0%,100%{transform:translate3d(0,0,-12px) scale(1.035)}50%{transform:translate3d(0,-4px,-12px) scale(1.055)}}
.scene-structure{position:absolute;z-index:3;display:block;filter:drop-shadow(0 13px 12px #09142699);transform-style:preserve-3d;animation:structureHover 5s ease-in-out infinite;}
.scene-structure img{display:block;width:100%;height:auto;overflow:visible;}
.scene-structure.lab{left:61%;top:22%;width:22%;max-width:210px;animation-delay:-1s}
.scene-structure.dock{left:7%;top:43%;width:25%;max-width:240px;animation-delay:-2.2s}
.scene-structure.habitat{left:39%;top:48%;width:23%;max-width:220px;animation-delay:-3.1s}
@keyframes structureHover{0%,100%{transform:translateY(0) rotate(-.4deg)}50%{transform:translateY(-5px) rotate(.5deg)}}
.scene-structure-label{position:absolute;left:50%;bottom:-7px;transform:translate(-50%,100%);white-space:nowrap;padding:4px 8px;border-radius:999px;background:#10243bdc;border:1px solid #d8edff55;color:#f4f8ff;font-size:10px;box-shadow:0 4px 12px #0006}
.scene-ruin{position:absolute;z-index:2;width:16%;min-width:65px;text-align:center;color:#d8e6f7;font-size:10px;text-shadow:0 2px 8px #06152b;}
.scene-ruin.lab{left:64%;top:35%}.scene-ruin.dock{left:11%;top:55%}.scene-ruin.habitat{left:43%;top:62%}
.ruin-plinth{position:relative;height:28px;margin:0 auto 3px;width:90%;transform:perspective(70px) rotateX(20deg);background:linear-gradient(145deg,#9ba9b8,#52667f 55%,#293e5a);clip-path:polygon(20% 0,100% 42%,78% 100%,0 54%);box-shadow:0 7px 8px #07142688}
.ruin-plinth:before{content:"";position:absolute;left:35%;top:-17px;width:30%;height:22px;background:linear-gradient(90deg,#8898ab,#d1d9d9,#63798e);clip-path:polygon(15% 0,100% 32%,80% 100%,0 65%)}
.ruin-plinth:after{content:"";position:absolute;left:47%;top:-22px;width:6px;height:14px;background:#9cdcf0;box-shadow:0 0 13px #8feaff;opacity:.55}
.island-label{z-index:5}.island-label small{max-width:60vw}
.structure-card-art{display:block;width:100%;height:112px;object-fit:contain;filter:drop-shadow(0 8px 9px #06132677);}
.building-card .art{height:120px;padding:4px;background:linear-gradient(145deg,#294766,#152b45);overflow:hidden;display:flex;align-items:center;justify-content:center}
.building-card .art img{height:100%;width:100%;object-fit:contain}
.building-card.unbuilt .art img{filter:saturate(.62) brightness(.76)}
.building-card.built .art img{filter:drop-shadow(0 0 8px #7edcf655)}
.facility-preview{border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 50% 25%,#35587c,#12233b 72%);padding:10px;border:1px solid #c6e5ff23;margin:12px 0}
.facility-preview img{width:100%;height:210px;object-fit:contain;filter:drop-shadow(0 15px 14px #06132688)}
.build-cinematic{position:relative;overflow:hidden;border-radius:18px;min-height:210px;background:radial-gradient(ellipse at 50% 35%,#476f93,#132744 70%);border:1px solid #bde8ff44;display:grid;place-items:center;perspective:900px}
.build-cinematic img{width:82%;max-height:210px;object-fit:contain;filter:drop-shadow(0 20px 14px #06132699);animation:buildRise 2s cubic-bezier(.18,.7,.2,1) both}
.build-cinematic:before{content:"";position:absolute;left:12%;right:12%;bottom:15%;height:20px;border-radius:50%;background:#75d9f855;filter:blur(16px);animation:buildGlow 1.4s ease-in-out infinite alternate}
.build-cinematic.stage-2:after{content:"";position:absolute;inset:10% 22%;border-left:2px dashed #dbe9fa88;border-right:2px dashed #dbe9fa88;border-top:2px dashed #dbe9fa66;animation:scaffold 1s ease-in-out infinite alternate;pointer-events:none}
.build-cinematic.stage-3 img{animation:buildFinish .55s ease-out both;filter:drop-shadow(0 0 16px #9beaffaa)}
@keyframes buildRise{0%{opacity:.2;transform:translateY(48px) scale(.68) rotateX(18deg)}70%{opacity:1;transform:translateY(-4px) scale(1.03) rotateX(0)}100%{transform:translateY(0) scale(1)}}
@keyframes buildGlow{from{opacity:.25;transform:scaleX(.8)}to{opacity:.9;transform:scaleX(1.1)}}
@keyframes scaffold{from{opacity:.2;transform:scaleY(.82)}to{opacity:.85;transform:scaleY(1)}}
@keyframes buildFinish{from{transform:scale(.88);filter:brightness(1.4)}to{transform:scale(1);filter:drop-shadow(0 0 16px #9beaffaa)}}
.construction-caption{position:absolute;z-index:3;bottom:10px;left:12px;right:12px;text-align:center;font-size:12px;font-weight:800;text-shadow:0 2px 8px #000;background:#0a1a2dbb;padding:9px;border-radius:12px}

const percent = (a,b) => b>0?Math.round(a/b*100):0;

  write(key,value){try{localStorage.setItem(STORAGE_PREFIX+key,JSON.stringify(value));return true;}catch(e){console.error('Storage write error',key,e);toast('保存できませんでした。ブラウザの空き容量を確認してください。','error');return false;}},
  remove(key){try{localStorage.removeItem(STORAGE_PREFIX+key);}catch(e){console.warn(e);}},
  all(){const out={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(STORAGE_PREFIX)){try{out[k.slice(STORAGE_PREFIX.length)]=JSON.parse(localStorage.getItem(k));}catch{}}}return out;}

function getAllUnits(){
  const out=[];
  CURRICULUM.forEach(subject => {
    subject.groups.forEach(group => {
      group.classes.forEach(cls => {
        cls.topics.forEach((topic,idx) => {
          out.push({subjectId:subject.id,subjectName:subject.name,groupId:group.id,groupName:group.name,classId:cls.id,className:cls.name,code:cls.code,topic,topicIndex:idx,unitId:`${cls.id}_${idx+1}`,title:cls.name});
        });
      });
    });
  });
  return out;
}
const ALL_UNITS=getAllUnits();
function nextRoadmapUnit(){
  const review=ALL_UNITS.find(u=>{const p=curriculumProgress[u.unitId];return p&&p.status==='REVIEW_REQUIRED';});
  if(review)return review;
  const aCleared=ALL_UNITS.filter(u=>u.subjectId==='A'&&['CLEARED','MASTERED'].includes(curriculumProgress[u.unitId]?.status)).length;
  const bAttempted=ALL_UNITS.filter(u=>u.subjectId==='B').map(u=>curriculumProgress[u.unitId]?.lastAttemptAt).filter(Boolean).sort().reverse()[0];
  const daysSinceB=bAttempted?Math.floor((Date.now()-new Date(bAttempted).getTime())/86400000):Infinity;
  // Roadmap policy: A remains the default priority; B is inserted after early A progress and then revisited when it has gone stale.
  if(aCleared>=3&&daysSinceB>=7){
    const bUnit=ALL_UNITS.find(u=>u.subjectId==='B'&&curriculumProgress[u.unitId]?.status!=='MASTERED');
    if(bUnit)return bUnit;
  }
  const firstA=ALL_UNITS.find(u=>u.subjectId==='A'&&curriculumProgress[u.unitId]?.status!=='MASTERED');
  if(firstA)return firstA;
  return ALL_UNITS.find(u=>!curriculumProgress[u.unitId]||curriculumProgress[u.unitId].status!=='MASTERED')||ALL_UNITS[0];
}
function findUnit(unitId){return ALL_UNITS.find(u=>u.unitId===unitId)||ALL_UNITS[0];}

function getPhase(date=new Date()){
  if(previewMode){return previewMode;}
  const m=minutesNow(date),s=settings.schedule;
  if(m>=toMinutes(s.routineStart)&&m<toMinutes(s.studyStart))return 'BRUSHING';
  if(m>=toMinutes(s.studyStart)&&m<toMinutes(s.closingStart))return 'STUDY';
  if(m>=toMinutes(s.closingStart)&&m<toMinutes(s.bedTime)){
    if(currentSession && !currentSession.reflection.saved && !currentSession.reflection.skipped)return 'CLOSING';
    return 'WIND_DOWN';
  }
  if(m>=toMinutes(s.bedTime))return 'COMPLETED';
  return 'FREE';
}
function getAppMode(){const p=getPhase();return ['BRUSHING','STUDY','CLOSING','WIND_DOWN'].includes(p)?'ROUTINE':p==='COMPLETED'?'COMPLETED':'FREE';}
function syncMode(){
  const phase=getPhase();currentMode=getAppMode();

  const nav=$('#bottomNav');
  nav.classList.toggle('hidden',currentMode!=='FREE');
  $('#topbar').classList.toggle('hidden',currentMode==='ROUTINE'||currentMode==='COMPLETED');

    if(screen!==phase.toLowerCase())screen=phase.toLowerCase();

}

function getMainQuestState(){
  const w=ensureGameWorld(),built=Object.entries(w.buildings).filter(([,b])=>b.status==='built');
  const completed=Object.entries(w.projects||{}).filter(([,p])=>p.completed);
  const done=!!w.world.lighthouseLit;
  const step=done?5:built.length===0?0:completed.length===0?1:built.length<2?2:completed.length<2?3:4;
  const titles=[
    '最初の拠点を取り戻す',
    '最初の開拓プロジェクトを完了する',
    '二つ目の施設を修復する',
    '二つ目の開拓プロジェクトを完了する',
    '星渡りの灯台を再点灯する',
    '群島の航路を取り戻した'
  ];
  const descriptions=[
    '漂着したこの島は、古い文明の拠点でした。研究・探索・育成のいずれかを選び、再建の足場を作りましょう。',
    '選んだ施設の機能を使って、島の記録・航路・生態系のいずれかを取り戻しましょう。',
    '灯台を再点灯するには、異なる専門性を持つ二つの施設が必要です。次の施設を選び、拠点の力を広げましょう。',
    '二つの施設をつなぐプロジェクトを完了し、灯台を動かすための共鳴部品を集めましょう。',
    '二つの施設と二つの開拓成果が揃いました。開拓資材を使って灯台に火を戻し、空の航路を再接続しましょう。',
    '星渡りの灯台が再点灯しました。ここから先は、自由に群島を広げることができます。'
  ];
  const progress=done?100:Math.round((step/5)*100);
  return {step,title:titles[step],description:descriptions[step],progress,builtCount:built.length,completedCount:completed.length,canIgnite:step===4&&built.length>=2&&completed.length>=2&&w.resources.developmentMaterials>=8,done};
}

function parseLocalDate(dateString){
  const parts=String(dateString||'').split('-').map(Number);
  if(parts.length!==3||parts.some(x=>!Number.isFinite(x)))return null;
  const d=new Date(parts[0],parts[1]-1,parts[2]);d.setHours(0,0,0,0);
  return Number.isNaN(d.getTime())?null:d;
}
function dateKeyLocal(date){
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}
function getNextStudyUnits(){
  const unitsA=ALL_UNITS.filter(u=>u.subjectId==='A'&&!['MASTERED'].includes(curriculumProgress[u.unitId]?.status));
  const unitsB=ALL_UNITS.filter(u=>u.subjectId==='B'&&!['MASTERED'].includes(curriculumProgress[u.unitId]?.status));
  const reviewA=unitsA.filter(u=>curriculumProgress[u.unitId]?.status==='REVIEW_REQUIRED');
  const reviewB=unitsB.filter(u=>curriculumProgress[u.unitId]?.status==='REVIEW_REQUIRED');
  const normalA=unitsA.filter(u=>curriculumProgress[u.unitId]?.status!=='REVIEW_REQUIRED');
  const normalB=unitsB.filter(u=>curriculumProgress[u.unitId]?.status!=='REVIEW_REQUIRED');
  return {A:[...reviewA,...normalA],B:[...reviewB,...normalB]};
}
function createAutoPlan(config){
  const exam=parseLocalDate(config.examDate);
  if(!exam)throw new Error('試験日を設定してください。');
  const today=new Date();today.setHours(0,0,0,0);
  const start=new Date(today);start.setDate(start.getDate()+1);
  if(exam<start)throw new Error('試験日は明日以降の日付にしてください。');
  const maxMinutes=Math.min(120,Math.max(20,toMinutes(settings.schedule.closingStart)-toMinutes(settings.schedule.studyStart)));
  if(!Array.isArray(config.studyDays)||!config.studyDays.length)throw new Error('学習する曜日を1日以上選択してください。');
  const minutes=Number(config.dailyMinutes),questions=Number(config.targetQuestions);
  if(!Number.isInteger(minutes)||minutes<20||minutes>maxMinutes)throw new Error(`1日の学習時間は20〜${maxMinutes}分で設定してください。夜の勉強枠を超える時間は指定できません。`);
  if(!Number.isInteger(questions)||questions<1||questions>100)throw new Error('問題数は1〜100問で設定してください。');
  const queues=getNextStudyUnits(),dates=[];
  for(let d=new Date(start);d<=exam;d.setDate(d.getDate()+1)){
    if(config.studyDays.includes(d.getDay()))dates.push(new Date(d));
  }
  if(!dates.length)throw new Error('試験日までの学習可能日がありません。');
  let a=0,b=0,consecutiveA=0;
  const sessions=[],covered=[];
  for(let i=0;i<dates.length;i++){
    let subject;
    if(a>=queues.A.length)subject='B';
    else if(b>=queues.B.length)subject='A';
    else if(consecutiveA>=3){subject='B';consecutiveA=0;}
    else subject='A';
    const unit=subject==='A'?queues.A[a++]:queues.B[b++];
    if(!unit)continue;
    if(subject==='A')consecutiveA++;else consecutiveA=0;
    const prior=covered.slice(-2);
    const isReviewDay=(i>0&&(i+1)%5===0);
    sessions.push({
      date:dateKeyLocal(dates[i]),subjectId:subject,unitId:unit.unitId,classId:unit.classId,
      title:unit.className,topic:unit.topic,groupName:unit.groupName,
      durationMinutes:minutes,targetQuestions:questions,
      startTime:settings.schedule.studyStart,
      blocks:[
        {kind:'review',minutes:Math.max(5,Math.round(minutes*0.125)),label:'前回の復習'},
        {kind:'summary',minutes:Math.max(5,Math.round(minutes*0.25)),label:'要点の確認'},
        {kind:'practice',minutes:minutes-Math.max(5,Math.round(minutes*0.125))-Math.max(5,Math.round(minutes*0.25)),label:'過去問演習'}
      ],
      reviewUnitIds:isReviewDay?prior.map(x=>x.unitId):[],
      status:'planned'
    });
    covered.push(unit);
  }
  const unplanned=[...queues.A.slice(a),...queues.B.slice(b)];
  const weeks={};
  sessions.forEach(session=>{
    const d=parseLocalDate(session.date),monday=new Date(d);monday.setDate(d.getDate()-((d.getDay()+6)%7));
    const key=dateKeyLocal(monday);(weeks[key]??=[]).push(session);
  });
  return {
    schemaVersion:1,examDate:config.examDate,generatedAt:new Date().toISOString(),
    startDate:dateKeyLocal(start),endDate:config.examDate,studyDays:[...config.studyDays],
    dailyMinutes:minutes,targetQuestions:questions,sessions,weeks,
    totalUnits:queues.A.length+queues.B.length,plannedUnits:sessions.length,
    unplannedUnits:unplanned.length,unplannedUnitIds:unplanned.map(x=>x.unitId),
    estimatedHours:Math.round(sessions.reduce((n,x)=>n+x.durationMinutes,0)/60*10)/10,
    subjectTotals:{A:sessions.filter(x=>x.subjectId==='A').length,B:sessions.filter(x=>x.subjectId==='B').length}
  };
}

function runExpedition(id){
  const w=ensureGameWorld(),d=expeditionDefs()[id];
  if(!d||w.buildings.explorationDock.status!=='built'){toast('探索港を修復すると遠征できます。');return;}
  if((w.resources.expeditionTickets||0)<1){toast('遠征券がありません。学習セッションの記録後に獲得できます。');return;}
  if(w.resources.developmentMaterials<d.cost){toast('遠征費用が足りません。別の航路を選ぶか、学習で資材を集めましょう。');return;}
  w.resources.expeditionTickets-=1;
  w.resources.developmentMaterials-=d.cost;
  let bonus=0; if(Math.random()<d.bonusChance)bonus=d.bonusMaterials;
  let rare=false,duplicate=false;
  const already=(w.discoveries||[]).some(x=>x.id===d.rareId);
  if(Math.random()<d.rareChance){
    if(!already){w.discoveries.push({id:d.rareId,name:d.rareName,icon:d.rareIcon,description:d.rareDescription,foundAt:new Date().toISOString()});rare=true;}
    else{duplicate=true;bonus+=3;}
  }
  const total=d.guaranteed+bonus;
  w.resources.developmentMaterials+=total;
  const record={id:uid('expedition'),missionId:id,name:d.name,cost:d.cost,guaranteed:d.guaranteed,bonus,netGain:total-d.cost,rare,duplicate,at:new Date().toISOString()};
  w.expeditionHistory.push(record);w.world.pendingProjectNotice=false;Store.write('game-world',w);
  const surprise=rare?`<div class="surprise">✧ 想定外の発見！「${escapeHTML(d.rareName)}」を獲得しました。</div>`:duplicate?'<div class="surprise">✧ 遺物の重複を資材3個に交換しました。</div>':bonus?'<div class="surprise">追加発見！ボーナス資材が上乗せされました。</div>':'<div class="small" style="margin-top:8px">今回は最低保証の報酬です。遠征の成果は確実に持ち帰りました。</div>';
  showModal(`<div class="eyebrow">EXPEDITION REPORT</div><h2>遠征成功：${escapeHTML(d.name)}</h2><div class="reward-result"><div class="small">確定報酬 ${d.guaranteed} − 費用 ${d.cost}</div><div class="reward-big">+${record.netGain} 資材</div><div class="small">追加資材：+${bonus} · 遠征券：−1</div>${surprise}</div><p class="small">どの航路でも最低報酬は保証されています。ランダム要素は追加発見だけに影響し、損失や失敗はありません。</p><div class="modal-actions"><button class="btn block" id="closeExpeditionResult">拠点へ戻る</button></div>`);
  $('#closeExpeditionResult').addEventListener('click',()=>{closeModal();screen='world';render();});
}

function handleReturn(){
  const active=currentSession.study.activeRunId;
  if(active){const run=currentSession.study.externalRuns.find(x=>x.id===active);if(run&&!run.returnedAt){run.returnedAt=new Date().toISOString();run.elapsedSeconds=Math.max(0,Math.floor((Date.now()-new Date(run.launchedAt).getTime())/1000));currentSession.study.totalElapsedSeconds=(currentSession.study.totalElapsedSeconds||0)+run.elapsedSeconds;currentSession.study.activeRunId=null;currentSession.study.resultStatus='pending';saveSession();}}
  const ex=Store.read('guard-exemption',null);
  if(ex&&ex.remainingUses>0&&ex.expiresAt>Date.now()){Store.remove('guard-exemption');return false;}
  if(ex&&ex.expiresAt<=Date.now())Store.remove('guard-exemption');
  const hiddenAt=currentSession.visibility.hiddenAt;
  if(hiddenAt){const elapsed=Math.floor((Date.now()-new Date(hiddenAt).getTime())/1000);currentSession.visibility.hiddenAt=null;saveSession();if(settings.guard.enabled&&elapsed>=settings.guard.returnThresholdSeconds){startGuard('resume');return true;}}
  return false;
}
function startGuard(source='manual'){
  const p=currentSession.guard; if(source==='manual')p.manualCount=(p.manualCount||0)+1;else p.resumeCount=(p.resumeCount||0)+1;p.lastTriggeredAt=new Date().toISOString();p.lastSource=source;saveSession();
  const returnScreen=screen;let seconds=settings.guard.guardSeconds;
  showModal(`<div class="eyebrow">INTERRUPTION GUARD</div><h2>一度、立ち止まりましょう。</h2><p class="lead">今、本当に必要な操作ですか？ ゆっくり呼吸して、元の行動に戻りましょう。</p><div class="timer-ring"><div><strong id="guardCounter">05</strong><div class="tiny">BREATHE</div></div></div><div class="modal-actions"><button class="btn block" id="guardReturn" disabled>元の行動に戻る</button></div>`,()=>{closeModal();screen=returnScreen;render();});
  const start=Date.now(),counter=$('#guardCounter'),btn=$('#guardReturn');const interval=setInterval(()=>{const left=Math.max(0,seconds-Math.floor((Date.now()-start)/1000));if(counter)counter.textContent=String(left).padStart(2,'0');if(left<=0){clearInterval(interval);if(btn)btn.disabled=false;}},100);
  if(btn)btn.addEventListener('click',()=>{clearInterval(interval);closeModal();render();});
}
function updateStudyResult(attempted,correct){
  if(!Number.isInteger(attempted)||!Number.isInteger(correct)||attempted<0||correct<0||correct>attempted){toast('解答数・正解数を確認してください。','error');return false;}
  currentSession.study.attemptedCount=attempted;currentSession.study.correctCount=correct;currentSession.study.resultStatus='saved';currentSession.study.resultRecordedAt=new Date().toISOString();
  const target=currentPlan.targetQuestions;currentSession.gamification.targetReached=attempted>=target;
  updateUnitProgress(currentPlan.unitId,currentPlan.subjectId,attempted,correct);
  saveSession();return true;
}
function updateUnitProgress(unitId,subjectId,attempted,correct){
  if(!unitId)return;
  const today=localDateKey();
  const prev=curriculumProgress[unitId]||{unitId,subjectId,status:'AVAILABLE',totalAttempted:0,totalCorrect:0,clearRewardGranted:false};
  const sameDay=prev.lastStudyDate===today;
  if(sameDay){
    prev.totalAttempted=Math.max(0,(prev.totalAttempted||0)-(prev.lastDailyAttempted||0))+attempted;
    prev.totalCorrect=Math.max(0,(prev.totalCorrect||0)-(prev.lastDailyCorrect||0))+correct;
  }else{
    prev.totalAttempted=(prev.totalAttempted||0)+attempted;
    prev.totalCorrect=(prev.totalCorrect||0)+correct;
  }
  prev.accuracy=percent(prev.totalCorrect,prev.totalAttempted);
  prev.lastDailyAttempted=attempted;prev.lastDailyCorrect=correct;prev.lastAttemptAt=new Date().toISOString();
  const dailyAccuracy=percent(correct,attempted);
  if(prev.status==='CLEARED'&&!sameDay&&attempted>=10&&dailyAccuracy>=80){prev.status='MASTERED';prev.masteredAt=new Date().toISOString();}
  else if(attempted>=10&&prev.status!=='MASTERED'){
    if(dailyAccuracy>=70){
      if(prev.status!=='CLEARED'){prev.status='CLEARED';prev.clearedAt=new Date().toISOString();prev.clearedOn=today;prev.justCleared=true;}
    }else{prev.status='REVIEW_REQUIRED';prev.justCleared=false;}
  }else if(!['CLEARED','MASTERED'].includes(prev.status)){prev.status='IN_PROGRESS';}
  prev.lastStudyDate=today;curriculumProgress[unitId]=prev;Store.write('curriculum-progress',curriculumProgress);
}
function calculateDailyRewards(){
  const s=currentSession,g=s.gamification,w=ensureGameWorld();if(g.rewardsGranted)return;
  const a=s.study.attemptedCount||0,c=s.study.correctCount||0,t=s.study.totalElapsedSeconds||0,target=currentPlan.targetQuestions||20;
  const q=Math.min(a,target),correctXp=Math.min(Math.floor(target/2),Math.floor(c/2)),timeXp=Math.min(4,Math.floor(t/600));
  const p=curriculumProgress[currentPlan.unitId];
  const firstClear=!!(p&&p.justCleared&&!p.clearRewardGranted&&p.clearedOn===localDateKey());
  const bonus=firstClear?5:0;
  const xp=q+correctXp+timeXp+bonus;
  const materials=(s.study.resultStatus==='saved'&&a>0?2:0)+(firstClear?3:0);
  const ticketEarned=s.study.resultStatus==='saved'&&a>0&&w.buildings.explorationDock.status==='built'?1:0;
  g.xpEarned=xp;g.materialsEarned=materials;g.expeditionTicketsEarned=ticketEarned;g.rewardsGranted=true;g.rewardBreakdown={question:q,correct:correctXp,time:timeXp,clear:bonus,materials,tickets:ticketEarned};
  w.resources.totalXp=(w.resources.totalXp||0)+xp;w.resources.developmentMaterials=(w.resources.developmentMaterials||0)+materials;w.resources.expeditionTickets=Math.min(3,(w.resources.expeditionTickets||0)+ticketEarned);
  if(firstClear&&w.buildings.habitat.status==='built'&&w.companion.speciesId){w.companion.growthPoints=(w.companion.growthPoints||0)+1;w.companion.growthStage=Math.min(3,1+Math.floor(w.companion.growthPoints/3));g.companionGrowth=true;}
  const date=localDateKey();w.dailyRewards=w.dailyRewards||{};w.dailyRewards[date]={xp,materials,tickets:ticketEarned,createdAt:new Date().toISOString()};
  if(firstClear){p.clearRewardGranted=true;p.justCleared=false;curriculumProgress[currentPlan.unitId]=p;Store.write('curriculum-progress',curriculumProgress);}
  updateAchievements(w);Store.write('game-world',w);saveSession();
}
function updateAchievements(w){
  const ach=w.achievements||[];const totalQ=Object.values(Store.all()).reduce((n,v)=>n+(v?.study?.attemptedCount||0),0)+(currentSession.study.attemptedCount||0);
  const earned=(id,name,desc)=>{if(!ach.some(a=>a.id===id))ach.push({id,name,desc,unlockedAt:new Date().toISOString()});};
  if(currentSession.study.attemptedCount>0)earned('FIRST_STEP','はじめの一歩','初めて演習結果を保存');
  const progress=Object.values(curriculumProgress);if(progress.some(x=>x.subjectId==='A'&&x.totalAttempted>0)&&progress.some(x=>x.subjectId==='B'&&x.totalAttempted>0))earned('BOTH_SUBJECTS','二つの学び','科目A・Bの両方に挑戦');
  if(totalQ>=100)earned('100_QUESTIONS','挑戦者','累計100問に挑戦');
  w.achievements=ach;
}

function writeDailyLog(bedtimeReached=false){
  const date=currentSession.date||localDateKey();
  const month=date.slice(0,7);
  const key=`logs:${month}`;
  const log=Store.read(key,{schemaVersion:1,month,records:[]});
  const record={date,brushingCompleted:currentSession.phaseStatuses.brushing==='completed',studyStarted:!!currentSession.study.startedAt,studyAttempted:currentSession.study.attemptedCount||0,studyCorrect:currentSession.study.correctCount||0,studySubject:currentPlan.subjectId,studyUnitId:currentPlan.unitId,closingCompleted:currentSession.phaseStatuses.closing==='completed',reflection:currentSession.reflection.content||'',xpEarned:currentSession.gamification.xpEarned||0,materialsEarned:currentSession.gamification.materialsEarned||0,bedtimeReached,completedAt:new Date().toISOString()};
  const idx=log.records.findIndex(r=>r.date===date);if(idx>=0)log.records[idx]={...log.records[idx],...record};else log.records.push(record);
  Store.write(key,log);if(bedtimeReached){currentSession.phaseStatuses.bedtime='completed';currentSession.events=currentSession.events||{};currentSession.events.bedtimeReachedAt=currentSession.events.bedtimeReachedAt||new Date().toISOString();}saveSession();
}
function finalizeDailySession(){
  if(!currentSession.gamification.rewardsGranted)calculateDailyRewards();
  if(currentSession.phaseStatuses.bedtime!=='completed')writeDailyLog(true);
}

}

  const w=ensureGameWorld(),d=buildingDefs()[id],b=w.buildings[id];if(!d||b.status==='built')return;
  if(w.strategy.currentFocus&&w.strategy.currentFocus!==d.route){toast('別ルートの施設です。先に開拓方針を変更してください。');return;}
  if(w.resources.developmentMaterials<d.cost){toast('開拓資材が足りません。');return;}
  showModal(`<div class="eyebrow">CONFIRM CONSTRUCTION</div><div class="facility-preview">${renderBuildingArt(id)}</div><h2>${d.name}を修復しますか？</h2><p class="lead">${escapeHTML(d.desc)}</p><div class="list-row"><span>必要資材</span><strong>🪵 ${d.cost}</strong></div><div class="list-row"><span>保有資材</span><strong>🪵 ${w.resources.developmentMaterials}</strong></div><div class="notice success">修復すると：${escapeHTML(d.reward)}</div><div class="modal-actions"><button class="btn secondary" data-action="modal-cancel">戻る</button><button class="btn" id="confirmBuild">修復する</button></div>`);
  $('#confirmBuild').addEventListener('click',()=>{
    closeModal();w.resources.developmentMaterials-=d.cost;b.status='building';b.buildStartedAt=Date.now();b.buildEndsAt=Date.now()+2200;w.strategy.initialFocus=w.strategy.initialFocus||d.route;w.strategy.currentFocus=d.route;w.decisions.push({type:'BUILD_FACILITY',buildingId:id,route:d.route,at:new Date().toISOString()});Store.write('game-world',w);screen='world';render();
    showModal(`<div class="eyebrow">RESTORATION SEQUENCE</div><h2>${d.name}を修復しています</h2><div class="build-cinematic stage-1" id="buildCinematic">${renderBuildingArt(id)}<div class="construction-caption" id="buildStageTitle">STEP 1 · 基礎を整えています</div></div><p class="small" style="margin-top:12px">足場が組まれ、光が灯り、施設が少しずつ島に姿を現します。</p><div class="modal-actions"><button class="btn secondary block" id="skipBuild">演出をスキップ</button></div>`);
    let finished=false;
    const updateStage=(n,label)=>{const el=$('#buildCinematic'),title=$('#buildStageTitle');if(el)el.className=`build-cinematic stage-${n}`;if(title)title.textContent=label;};
    const finish=()=>{if(finished)return;finished=true;pendingBuildTimers.forEach(clearTimeout);pendingBuildTimers=[];const fresh=ensureGameWorld();fresh.buildings[id].status='built';fresh.buildings[id].level=1;fresh.buildings[id].buildEndsAt=null;fresh.world.visualStage=Math.min(5,(fresh.world.visualStage||0)+1);fresh.world.pendingProjectNotice=true;if(id==='habitat'&&!fresh.companion.speciesId){fresh.companion.speciesId='island_spirit';fresh.companion.growthStage=1;fresh.companion.growthPoints=0;}if(id==='researchLab')fresh.features.researchLabUnlocked=true;if(id==='explorationDock')fresh.features.expeditionsUnlocked=true;Store.write('game-world',fresh);closeModal();toast(`${d.name}が完成しました。島の景観が変化しました。`);render();};
    pendingBuildTimers=[setTimeout(()=>updateStage(2,'STEP 2 · 石組みと設備を組み上げています'),700),setTimeout(()=>updateStage(3,'STEP 3 · 光が灯り、修復が完了します'),1450),setTimeout(finish,2200)];
    $('#skipBuild').addEventListener('click',finish);
  });
}
function changeRoute(){
  const w=ensureGameWorld(),current=w.strategy.currentFocus;const cost=4;if(!w.strategy.initialFocus){toast('最初の施設を修復してから開拓方針を変更できます。');return;}
  showModal(`<div class="eyebrow">STRATEGY CHANGE</div><h2>開拓方針を変更</h2><p class="lead">現在：${routeLabel(current)||'未選択'}。変更には開拓資材4個（初期設定値）が必要です。建設済み施設や解放済み地域は失われません。</p><div class="stack" style="margin-top:14px">${[['research','🔭 研究ルート'],['exploration','🛩️ 探索ルート'],['habitat','🌱 育成ルート']].map(([id,n])=>`<button class="choice" data-action="route-select" data-route="${id}"><div class="choice-body"><strong>${n}</strong><p>${id===current?'現在選択中':''}</p></div><span>→</span></button>`).join('')}</div><div class="small" style="margin-top:10px">保有資材：${w.resources.developmentMaterials} / 変更費用：${cost}</div><div class="modal-actions"><button class="btn ghost" data-action="modal-cancel">閉じる</button></div>`,null);
}
function applyRoute(route){
  const w=ensureGameWorld(),cost=4;
  if(!['research','exploration','habitat'].includes(route)){closeModal();return;}
  if(w.strategy.currentFocus===route){closeModal();toast('現在選択中のルートです。');return;}
  if(w.resources.developmentMaterials<cost){toast('ルート変更に必要な資材が足りません。');return;}
  w.resources.developmentMaterials-=cost;w.strategy.currentFocus=route;w.decisions.push({type:'CHANGE_ROUTE',route,cost,at:new Date().toISOString()});Store.write('game-world',w);closeModal();toast(`${routeLabel(route)}を優先します。建設済み施設はそのまま残ります。`);render();
}
function startProject(id){
  const w=ensureGameWorld();
  const defs={library_restoration:{name:'図書館の修復',building:'researchLab',cost:6,unlock:'knowledge_archive'},outer_island_scout:{name:'周辺島の調査',building:'explorationDock',cost:6,unlock:'outer_island'},habitat_garden:{name:'生息地の整備',building:'habitat',cost:6,unlock:'companion'}};
  if(id==='beacon_reignition'){
    const q=getMainQuestState();
    if(!q.canIgnite){toast('二つの施設・二つの開拓プロジェクト・資材8個が必要です。');return;}
    w.resources.developmentMaterials-=8;w.resources.developmentMaterials+=10;w.resources.totalXp=(w.resources.totalXp||0)+40;
    w.world.lighthouseLit=true;w.world.visualStage=5;
    if(!w.world.unlockedAreas.includes('starward_realm'))w.world.unlockedAreas.push('starward_realm');
    w.projects.beacon_reignition={completed:true,completedAt:new Date().toISOString(),unlock:'starward_realm'};
    w.mainQuest.claimedMilestones.push('beacon_reignition');
    w.discoveries.push({id:'starward_beacon_core',name:'星渡りの灯火核',icon:'✧',description:'灯台を再点灯した証。孤立していた浮遊群島の航路が再接続された。',foundAt:new Date().toISOString()});
    Store.write('game-world',w);toast('星渡りの灯台が再点灯しました。新しい群島への航路が開きました。');render();return;
  }
  const p=defs[id];if(!p||w.projects[id]?.completed)return;
  if(w.resources.developmentMaterials<p.cost){toast('資材が足りません。');return;}
  if(w.buildings[p.building].status!=='built'){toast('前提施設を修復してください。');return;}
  w.resources.developmentMaterials-=p.cost;
  const completedPrior=Object.values(w.projects).filter(x=>x.completed).length;
  w.projects[id]={completed:true,completedAt:new Date().toISOString(),unlock:p.unlock};
  if(id==='library_restoration'){w.features.knowledgeArchive=true;w.resources.developmentMaterials+=2;}
  if(id==='outer_island_scout'){if(!w.world.unlockedAreas.includes('outer_island'))w.world.unlockedAreas.push('outer_island');w.features.outerIslandUnlocked=true;w.resources.expeditionTickets=Math.min(3,(w.resources.expeditionTickets||0)+1);}
  if(id==='habitat_garden'){w.companion.speciesId='island_spirit';w.companion.growthStage=Math.max(1,w.companion.growthStage||0);w.companion.growthPoints=w.companion.growthPoints||0;w.features.companionUnlocked=true;}
  if(completedPrior<2){w.resources.developmentMaterials+=completedPrior===0?3:5;w.mainQuest.claimedMilestones.push('project-'+id);}
  w.world.visualStage=Math.min(5,(w.world.visualStage||0)+1);w.world.pendingProjectNotice=true;w.decisions.push({type:'COMPLETE_PROJECT',projectId:id,at:new Date().toISOString()});Store.write('game-world',w);
  const reward=id==='library_restoration'?'知識アーカイブと資材2個':id==='outer_island_scout'?'新しい島と遠征券1枚':'仲間の生息地';
  toast(`${p.name}完了！ ${reward}を獲得しました。`);render();
}
function renameIsland(){const w=ensureGameWorld();showModal(`<div class="eyebrow">ISLAND NAME</div><h2>島の名前を変更</h2><div class="field"><label for="islandNameInput">島の名前（1〜16文字）</label><input id="islandNameInput" class="input" maxlength="16" value="${escapeHTML(w.world.name)}"></div><div class="modal-actions"><button class="btn secondary" data-action="modal-cancel">キャンセル</button><button class="btn" id="saveIslandName">保存</button></div>`);$('#saveIslandName').addEventListener('click',()=>{const val=$('#islandNameInput').value.trim();if(!val||[...val].length>16){toast('1〜16文字で入力してください。');return;}w.world.name=val;Store.write('game-world',w);closeModal();render();toast('島の名前を変更しました。');});}
function savePlan(){
  const subject=$('#planSubject').value,classId=$('#planClass').value,topic=$('#planTopic').value,target=Number($('#planTarget').value);
  if(!Number.isInteger(target)||target<1||target>100){toast('演習目標は1〜100問で入力してください。');return;}
  const unit=ALL_UNITS.find(u=>u.classId===classId&&u.topic===topic);if(!unit){toast('学習テーマを選択してください。');return;}
  const points=$$('.plan-point').map(x=>x.value.trim()).filter(Boolean);if(points.length===0){toast('要点を1つ以上登録してください。');return;}
  currentPlan={...currentPlan,subjectId:subject,classId,topic,title:unit.className,unitId:unit.unitId,points,targetQuestions:target,source:'manual',modifiedByUser:true,updatedAt:new Date().toISOString()};persistPlan();toast('今日の学習計画を保存しました。');screen='plan';render();
}
function suggestPlan(){const next=nextRoadmapUnit();currentPlan.subjectId=next.subjectId;currentPlan.classId=next.classId;currentPlan.unitId=next.unitId;currentPlan.topic=next.topic;currentPlan.title=next.className;currentPlan.points=getDefaultNotes(next.classId,next.topic);currentPlan.source='roadmap';currentPlan.modifiedByUser=false;Store.write(getTodayPlanKey(),currentPlan);render();toast('ロードマップから次の単元を提案しました。');}
function addPoint(){const root=$('#pointEditor');if(!root)return;if($$('.plan-point',root).length>=5){toast('要点は最大5項目までです。');return;}const n=$$('.plan-point',root).length;const div=document.createElement('div');div.className='field';div.innerHTML=`<label>要点 ${n+1}</label><textarea class="textarea plan-point" data-index="${n}" maxlength="200"></textarea>`;root.appendChild(div);div.querySelector('textarea').focus();}
function saveSettings(){
  const times={routineStart:$('#setStart').value,studyStart:$('#setStudy').value,closingStart:$('#setClosing').value,bedTime:$('#setBed').value};
  const values=Object.values(times).map(toMinutes);if(values.some(v=>!Number.isFinite(v))||!(values[0]<values[1]&&values[1]<values[2]&&values[2]<values[3])){toast('時刻は開始から就寝まで順番に設定してください。');return;}
  const brush=Number($('#setBrush').value),questions=Number($('#setQuestions').value);if(!Number.isInteger(brush)||brush<30||brush>600||!Number.isInteger(questions)||questions<1||questions>100){toast('タイマーは30〜600秒、問題数は1〜100問で設定してください。');return;}
  settings.schedule=times;settings.timers.brushingSeconds=brush;settings.study.defaultTargetQuestions=questions;settings.locale=$('#setLocale').value;persistSettings();toast('設定を保存しました。');syncMode();
}
function showResultModal(){
  const s=currentSession.study;showModal(`<div class="eyebrow">PRACTICE RESULT</div><h2>今日の演習結果</h2><p class="small">過去問道場で解いた合計を入力してください。複数回に分けて演習した場合は合計値を入力します。</p><div class="field" style="margin-top:12px"><label for="resultAttempted">解答した問題数</label><input id="resultAttempted" class="input" type="number" min="0" max="500" value="${s.attemptedCount}"></div><div class="field" style="margin-top:10px"><label for="resultCorrect">正解した問題数</label><input id="resultCorrect" class="input" type="number" min="0" max="500" value="${s.correctCount}"></div><div class="notice" style="margin-top:12px">不正解数・正答率・XPは自動計算します。過去問道場の成績を自動取得する機能は含みません。</div><div class="modal-actions"><button class="btn secondary" data-action="modal-cancel">後で入力</button><button class="btn" id="saveResult">保存</button></div>`);$('#saveResult').addEventListener('click',()=>{const a=Number($('#resultAttempted').value),c=Number($('#resultCorrect').value);if(!Number.isInteger(a)||!Number.isInteger(c)||a<0||a>500||c<0||c>a){toast('解答数・正解数を確認してください。');return;}if(updateStudyResult(a,c)){closeModal();toast('演習結果を保存しました。');render();}});
}
function exportData(){const blob=new Blob([JSON.stringify(Store.all(),null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`night-flow-backup-${localDateKey()}.json`;a.click();URL.revokeObjectURL(url);toast('バックアップを書き出しました。');}
function importData(file){const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(!obj||typeof obj!=='object')throw new Error('invalid');Object.entries(obj).forEach(([k,v])=>{if(k==='onboarding-complete'||k.startsWith('settings')||k.startsWith('game-world')||k.startsWith('plan:')||k.startsWith('session:')||k.startsWith('curriculum-progress')||k.startsWith('logs:')||k.startsWith('roadmap'))Store.write(k,v);});location.reload();}catch{toast('バックアップファイルを読み込めませんでした。');}};reader.readAsText(file);}
function resetData(){showModal(`<div class="eyebrow">RESET DATA</div><h2>すべてのデータを初期化しますか？</h2><p class="lead">学習記録・ゲームの開拓状況・設定が削除されます。この操作は元に戻せません。</p><div class="modal-actions"><button class="btn secondary" data-action="modal-cancel">キャンセル</button><button class="btn danger" id="confirmReset">初期化する</button></div>`);$('#confirmReset').addEventListener('click',()=>{Object.keys(Store.all()).forEach(k=>Store.remove(k));location.reload();});}

// Event delegation
$('#appRoot').addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;
  if(a==='nav'){setScreen(el.dataset.screen);return;}
  if(a==='tutorial-open'){showTutorial(true);return;}
  if(a==='campaign-next'){campaignNext();return;}
  if(a==='roadmap-generate'){saveAutoPlan();return;}
  if(a==='roadmap-prev'){roadmapWeekIndex=Math.max(0,roadmapWeekIndex-1);render();return;}
  if(a==='roadmap-next'){const n=Object.keys(getAutoPlan()?.weeks||{}).length;roadmapWeekIndex=Math.min(Math.max(0,n-1),roadmapWeekIndex+1);render();return;}
  if(a==='expedition'){runExpedition(el.dataset.expedition);return;}
  if(a==='preview'){previewMode=el.dataset.mode==='REAL'?null:el.dataset.mode;syncMode();toast(previewMode?`プレビュー：${previewMode}`:'実際の時刻に戻しました。');return;}
  if(a==='brush-start'){setBrushTimer();return;}
  if(a==='brush-complete'){completeBrush();return;}
  if(a==='guard'){startGuard('manual');return;}
  if(a==='dojo'){startStudy();openDojo(el.dataset.subject);return;}
  if(a==='phone'){openPhone();return;}
  if(a==='result'){showResultModal();return;}
  if(a==='closing-save'){saveClosing(false);return;}
  if(a==='closing-skip'){saveClosing(true);return;}
  if(a==='plan-edit'){screen='plan';render();return;}
  if(a==='save-plan'){savePlan();return;}
  if(a==='suggest-plan'){suggestPlan();return;}
  if(a==='add-point'){addPoint();return;}
  if(a==='building-detail'){selectedBuilding=el.dataset.building;screen='facility';render();return;}
  if(a==='build'){buildFacility(el.dataset.building);return;}
  if(a==='change-route'){changeRoute();return;}
  if(a==='route-select'){applyRoute(el.dataset.route);return;}
  if(a==='project-start'){startProject(el.dataset.project);return;}
  if(a==='rename-island'){renameIsland();return;}
  if(a==='save-settings'){saveSettings();return;}
  if(a==='export-data'){exportData();return;}
  if(a==='reset-data'){resetData();return;}
  if(a==='modal-cancel'){closeModal();return;}
});
$('#modalRoot').addEventListener('click',e=>{
  if(e.target.classList.contains('modal-backdrop')){if(tutorialActive)return;closeModal();return;}
  const el=e.target.closest('[data-action]');if(!el)return;
  if(el.dataset.action==='modal-cancel'){closeModal();return;}
  if(el.dataset.action==='route-select'){applyRoute(el.dataset.route);return;}
  if(el.dataset.action==='tutorial-next'){moveTutorial(1);return;}
  if(el.dataset.action==='tutorial-prev'){moveTutorial(-1);return;}
  if(el.dataset.action==='tutorial-skip'||el.dataset.action==='tutorial-finish'){finishTutorial();return;}
});
$('#main').addEventListener('input',e=>{if(e.target.id==='reflection'){currentSession.reflection.content=e.target.value;saveSession();}});
$('#main').addEventListener('change',e=>{
  if(e.target.id==='planSubject'){
    const sub=CURRICULUM.find(x=>x.id===e.target.value);const cl=sub.groups.flatMap(g=>g.classes);$('#planClass').innerHTML=cl.map(c=>`<option value="${c.id}">${escapeHTML(c.name)}</option>`).join('');const first=cl[0];$('#planTopic').innerHTML=renderTopicOptions(first.id,first.topics[0]);
  }
  if(e.target.id==='planClass'){$('#planTopic').innerHTML=renderTopicOptions(e.target.value,ALL_UNITS.find(x=>x.classId===e.target.value)?.topic);}
  if(e.target.id==='importFile'&&e.target.files?.[0])importData(e.target.files[0]);
});

function handleVisibility(){
  if(document.visibilityState==='hidden'){
    currentSession.visibility.hiddenAt=new Date().toISOString();saveSession();
  } else if(document.visibilityState==='visible'){
    currentSession=getSession();handleReturn();syncMode();
  }
}
document.addEventListener('visibilitychange',handleVisibility);
window.addEventListener('pagehide',()=>{currentSession.visibility.hiddenAt=new Date().toISOString();saveSession();});
window.addEventListener('pageshow',()=>{if(!document.hidden){currentSession=getSession();ensurePlan();if(handleReturn())return;syncMode();}});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;});

let activeDate=localDateKey();
function tick(){
  if(localDateKey()!==activeDate){activeDate=localDateKey();currentSession=getSession();currentPlan=null;ensurePlan();}
  const mode=getAppMode();if(mode!==currentMode||((mode==='ROUTINE')&&getPhase().toLowerCase()!==screen)){syncMode();}
  const brush=$('#brushTimer');if(brush&&currentSession.timer?.brushStart){const left=Math.max(0,settings.timers.brushingSeconds-Math.floor((Date.now()-new Date(currentSession.timer.brushStart).getTime())/1000));brush.textContent=fmtDuration(left);}
  const bed=$('#bedTimer');if(bed){const left=Math.max(0,toMinutes(settings.schedule.bedTime)-minutesNow(new Date()));bed.textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;}
  const remaining=$('#studyRemaining');if(remaining){const left=Math.max(0,toMinutes(settings.schedule.closingStart)-minutesNow(new Date()));remaining.textContent=`${left}分`}
  const meta=$('#topMeta');if(meta&&currentMode==='FREE')meta.querySelector('.pill')?.replaceChildren(document.createTextNode(`✦ Lv.${Math.floor((ensureGameWorld().resources.totalXp||0)/100)+1}`));
}
function init(){
  ensureGameWorld();currentSession=getSession();ensurePlan();
  if(currentSession.visibility.hiddenAt && !document.hidden){handleReturn();}
  syncMode();
  if(!Store.read('onboarding-complete',false))showTutorial(false);
  if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('SW registration failed',err));
  timerTick=setInterval(tick,1000);
}
init();
</script>
