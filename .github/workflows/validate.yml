name: Validate Night Flow
on:
  push:
    branches:
      - feature/real-3d-campaign-gantt-planner
      - preview/try-night-flow
  pull_request:
    branches:
      - main
      - repair/dynamic-island-onboarding-rewards
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check application JavaScript
        run: node scripts/validate.mjs
      - name: Check 3D ES modules
        run: |
          node --input-type=module --check < assets/js/island-3d.js
          node --input-type=module --check < assets/vendor/three.module.js
          node --input-type=module --check < assets/vendor/three.core.js
      - name: Check service worker
        run: node --check sw.js

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve static app
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/night-flow-http.log 2>&1 &
          echo $! > /tmp/night-flow-http.pid
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
      - name: Test desktop, WebGL, campaign and Gantt on mobile viewport
        run: node scripts/e2e.mjs
