<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Floating archipelago base</title><desc id="desc">A living floating island with moving clouds, wind, trees, waterfalls and distant islands.</desc><style><![CDATA[.scene-cloud{animation:cloudDrift 32s linear infinite;transform-box:fill-box;transform-origin:center}.cloud-b{animation-duration:42s;animation-direction:reverse}.main-island-float{animation:islandFloat 8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.far-island{animation:farFloat 9s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.far-right{animation-delay:-4s}.tree{animation:treeSway 4.7s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}.tree-two{animation-duration:5.6s;animation-delay:-1.8s}.tree-three{animation-duration:4.1s;animation-delay:-2.5s}.grass-clumps{animation:grassSway 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}.waterfall{animation:waterShimmer 2.1s ease-in-out infinite}.airship{animation:shipDrift 17s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.lantern{animation:lanternSwing 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:top center}.campfire .flame{animation:flameFlicker .8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center bottom}.motes circle{animation:mote 4s ease-in-out infinite}.scene-stars circle{animation:twinkle 3.5s ease-in-out infinite}@keyframes cloudDrift{0%{transform:translateX(-35px)}50%{transform:translateX(38px)}100%{transform:translateX(-35px)}}@keyframes islandFloat{0%,100%{transform:translateY(0) rotate(-.12deg)}50%{transform:translateY(-8px) rotate(.12deg)}}@keyframes farFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}@keyframes treeSway{0%,100%{transform:rotate(-1.1deg)}50%{transform:rotate(1.4deg)}}@keyframes grassSway{0%,100%{transform:skewX(-2deg)}50%{transform:skewX(3deg)}}@keyframes waterShimmer{0%,100%{opacity:.68}50%{opacity:1}}@keyframes shipDrift{0%,100%{transform:translate(0,0) rotate(-2deg)}50%{transform:translate(-38px,-10px) rotate(2deg)}}@keyframes lanternSwing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}@keyframes flameFlicker{from{transform:scale(.9,.92)}to{transform:scale(1.08,1.12)}}@keyframes mote{0%,100%{opacity:.15;transform:translateY(6px)}50%{opacity:.95;transform:translateY(-16px)}}@keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.scene-cloud,.main-island-float,.far-island,.tree,.grass-clumps,.waterfall,.airship,.lantern,.campfire .flame,.motes circle,.scene-stars circle{animation:none!important}}]]></style><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#152a61"/><stop offset=".52" stop-color="#5d6fae"/><stop offset="1" stop-color="#e9a5b3"/></linearGradient><linearGradient id="cloud" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#b8c6ed" stop-opacity=".55"/></linearGradient><linearGradient id="grass" x2="0" y2="1"><stop stop-color="#8bcf9a"/><stop offset="1" stop-color="#347d71"/></linearGradient><linearGradient id="cliff" x2="0" y2="1"><stop stop-color="#687c9e"/><stop offset=".55" stop-color="#344764"/><stop offset="1" stop-color="#192841"/></linearGradient><linearGradient id="water" x2="0" y2="1"><stop stop-color="#95f3ff" stop-opacity=".9"/><stop offset="1" stop-color="#4eaed5" stop-opacity=".06"/></linearGradient><filter id="soft"><feGaussianBlur stdDeviation="14"/></filter></defs><rect width="1200" height="675" fill="url(#sky)"/><circle cx="1020" cy="110" r="110" fill="#ffc8cb" opacity=".16" filter="url(#soft)"/><g class="scene-stars" fill="#fff8d9"><circle cx="265" cy="83" r="2"/><circle cx="635" cy="50" r="2.3"/><circle cx="1040" cy="206" r="1.8"/><circle cx="840" cy="100" r="1.4"/><circle cx="1160" cy="160" r="2"/></g><g class="scene-cloud cloud-a" fill="url(#cloud)" opacity=".65"><ellipse cx="160" cy="280" rx="155" ry="30"/><ellipse cx="105" cy="266" rx="70" ry="37"/><ellipse cx="205" cy="258" rx="90" ry="42"/></g><g class="scene-cloud cloud-b" fill="url(#cloud)" opacity=".58"><ellipse cx="990" cy="295" rx="180" ry="34"/><ellipse cx="930" cy="277" rx="88" ry="42"/><ellipse cx="1060" cy="273" rx="100" ry="48"/></g><g class="far-island far-left" transform="translate(80 265)"><path d="M-96 6L-74-38-24-58 34-42 91-4 45 15-18 23z" fill="#394f7b"/><path d="M-74-38L-24-58 34-42 91-4 45 15-18 23z" fill="#7593b5"/><path d="M-12-56l25-43 30 42" fill="#6ca68d"/><path d="M-17 23l-12 64 26-38 11 65 20-68 32 43 2-74" fill="#263b62"/></g><g class="far-island far-right" transform="translate(1080 250) scale(.78)"><path d="M-110 0L-65-49 8-61 92-22 112 12 45 25-34 26z" fill="#536b8d"/><path d="M-65-49L8-61 92-22 112 12 45 25-34 26z" fill="#94b39f"/></g><ellipse cx="600" cy="560" rx="420" ry="55" fill="#15233f" opacity=".42" filter="url(#soft)"/><g class="main-island-float"><path d="M170 398L260 338 403 312 600 300 800 316 971 365 1040 425 986 483 888 530 730 568 525 578 348 548 225 496z" fill="url(#cliff)" stroke="#273b59" stroke-width="8"/><path d="M176 392L265 333 408 302 610 292 803 309 974 358 1038 414 1000 448 885 465 725 483 526 486 350 470 224 443z" fill="url(#grass)" stroke="#a6d6a0" stroke-opacity=".55" stroke-width="5"/><g class="waterfall"><path d="M335 492Q350 540 342 625L358 675 396 675Q370 607 378 533L384 475z" fill="url(#water)"/></g><g class="waterfall"><path d="M865 480Q875 530 910 623L933 675 970 675Q930 590 912 519L900 465z" fill="url(#water)"/></g><g class="grass-clumps" fill="none" stroke="#9bdb9d" stroke-width="5" stroke-linecap="round"><path d="M300 408q-14-25-4-43m8 43q4-27 20-37M720 445q-8-27 5-42m1 43q16-21 30-18M890 397q-10-22-2-38"/></g><g class="tree tree-one" transform="translate(300 355)"><path d="M0 30l-4 58h15l-2-58" fill="#74503c"/><path d="M4-18Q-34-8-25 20Q-47 46-13 55Q20 68 39 42Q62 14 30 0Q36-27 4-18" fill="#397a66" stroke="#9dce9c" stroke-width="4"/></g><g class="tree tree-two" transform="translate(885 365) scale(.82)"><path d="M0 30l-4 58h15l-2-58" fill="#70503b"/><path d="M3-32l-25 53 18-4-28 34 38-10 30 10-25-35 22 5z" fill="#2f745f" stroke="#89bf8f" stroke-width="3"/></g><g class="tree tree-three" transform="translate(455 345) scale(.52)"><path d="M0 30l-4 58h15l-2-58" fill="#70503b"/><path d="M4-18Q-34-8-25 20Q-47 46-13 55Q20 68 39 42Q62 14 30 0Q36-27 4-18" fill="#4a8e6d" stroke="#9dce9c" stroke-width="4"/></g><g class="ruins" transform="translate(540 354)"><path d="M-56 60V8Q-56-30-18-30H15Q55-30 55 8V60" fill="none" stroke="#9aa8b7" stroke-width="17" stroke-linecap="round"/><path d="M-62 60h124" stroke="#657991" stroke-width="14"/></g><g class="crystal"><path d="M400 445l16-44 17 43-17 25z" fill="#58dff0" stroke="#c2f8ff" stroke-width="2"/></g><g class="lantern" transform="translate(210 375)"><path d="M0 0v38" stroke="#e9d7a8" stroke-width="3"/><path d="M-9 19h18l-3 19h-12z" fill="#f3bd72"/></g><g class="campfire" transform="translate(660 432)"><ellipse cy="23" rx="38" ry="12" fill="#263b51"/><path d="M-14 13l28-8" stroke="#75513d" stroke-width="7" stroke-linecap="round"/><path class="flame" d="M0 12Q-20-7-3-25Q-2-10 8-18Q20-3 0 12" fill="#ffb35c"/></g></g><g class="airship" transform="translate(930 205)"><path d="M-48 0Q-30-35 20-30Q63-23 54 0Q37 22-26 18z" fill="#d7d7cf" stroke="#6b7894" stroke-width="4"/><path d="M-15 16l-3 28m30-27l7 28" stroke="#d7b783" stroke-width="3"/><path d="M-26 45h49l-9 13h-33z" fill="#956e50"/></g><g class="motes" fill="#b9f3ff"><circle cx="445" cy="270" r="3"/><circle cx="720" cy="282" r="2"/><circle cx="1040" cy="425" r="3"/><circle cx="255" cy="455" r="2.5"/></g></svg>